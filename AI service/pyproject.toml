[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "flask>=3.1.3",
    "langchain>=1.3.16",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mlflow>=3.15.1",
    "mlflow-skinny>=3.15.1",
    # mlflow.langchain.autolog() unconditionally imports pandas internally, even though
    # we never touch it ourselves -- not part of mlflow-skinny, so it has to be explicit.
    "pandas>=2.2.0",
    # Serves the all-MiniLM-L6-v2 embedding model via ONNX -- same model the
    # sentence-transformers library would give us, without pulling in torch.
    "fastembed>=0.4.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.2.3",
    "langchain-openai>=1.6.0",
]
